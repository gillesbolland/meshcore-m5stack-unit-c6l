name: release-firmware
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Build hybrid companion
        run: |
          chmod +x scripts/setup-and-build.sh
          # Tag v1.17.1 → FIRMWARE_VERSION=v1.17.1 for public filenames
          FIRMWARE_VERSION="${GITHUB_REF_NAME:-v1.17.1}" ./scripts/setup-and-build.sh
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/m5stack_unit_c6l_companion-*.bin
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/m5stack_unit_c6l_companion-*.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
